<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программа расчёта кредита</title>
    <link rel="stylesheet" href="./css/calculator.css">
</head>
<body>
    <div class="container">
        <h1>ПРОГРАММА РАСЧЁТА КРЕДИТА</h1>
        
        <div class="form-group">
            <label for="principal">Сумма кредита P (руб.):</label>
            <input type="number" id="principal" placeholder="Например: 100000" min="0">
        </div>
        
        <div class="form-group">
            <label for="rate">Процентная ставка i (%):</label>
            <input type="number" id="rate" placeholder="Например: 10" min="0" step="0.1">
        </div>
        
        <div class="form-group">
            <label for="days">Срок (дней):</label>
            <input type="number" id="days" placeholder="Например: 180" min="30" max="3650">
        </div>
        
        <div class="form-group">
            <label for="practice">Практика начисления:</label>
            <select id="practice">
                <option value="german">Германская (360 дней)</option>
                <option value="french">Французская (360 дней)</option>
                <option value="english">Английская (365 дней)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="type">Тип процентов:</label>
            <select id="type">
                <option value="simple">Простые проценты</option>
                <option value="compound">Сложные проценты</option>
            </select>
        </div>
        
        <button onclick="calculate()">Рассчитать</button>
        
        <div id="result" class="result" style="display: none;"></div>
        
        <a href="index.html" class="back-link">← Вернуться к презентации</a>
    </div>

    <script>
        function calculate() {
            const P = parseFloat(document.getElementById('principal').value);
            const i = parseFloat(document.getElementById('rate').value) / 100;
            const days = parseInt(document.getElementById('days').value);
            const practice = document.getElementById('practice').value;
            const type = document.getElementById('type').value;
            
            if (isNaN(P) || isNaN(i) || isNaN(days) || P < 0 || i < 0 || days < 30) {
                alert('Пожалуйста, заполните все поля корректно!\nСрок должен быть от 30 дней.');
                return;
            }
            
            let n;
            if (practice === 'german' || practice === 'french') {
                n = days / 360;
            } else {
                n = days / 365;
            }
            
            let S;
            if (type === 'simple') {
                S = P * (1 + n * i);
            } else {
                S = P * Math.pow((1 + i), n);
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div>Наращенная сумма:</div>
                <div style="font-size: 1.5em; margin-top: 10px;">
                    S = ${S.toFixed(2)} руб.
                </div>
                <div style="font-size: 0.6em; margin-top: 15px; color: #888;">
                    P = ${P.toFixed(2)} руб., i = ${(i*100).toFixed(2)}%, 
                    n = ${n.toFixed(4)} лет (${days} дней)
                </div>
            `;
        }
    </script>
</body>
</html>
